[project]
name = "chimp"
version = "0.1.0"
description = "Local OpenAI-compatible router that prefers a model already loaded in VRAM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stephen Phillips" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
chimp = "chimp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chimp = ["models.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
