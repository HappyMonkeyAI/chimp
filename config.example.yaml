# Copy to config.yaml and point base_url at the machines on your LAN.
# Secrets come from the environment: ${NAME} or ${NAME:-default}.

listen: 127.0.0.1:8787
# Set CHIMP_API_KEY to require Authorization: Bearer on every route except /health.
api_key: ${CHIMP_API_KEY:-}
# Set CHIMP_ADMIN_KEY (different from CHIMP_API_KEY) to enable the /ui/config editor.
# Inference clients holding api_key cannot read or rewrite config; unset means no config over HTTP.
admin_key: ${CHIMP_ADMIN_KEY:-}
poll_interval_seconds: 10
request_timeout_seconds: 600
# Optional path to a role-affinity map (defaults to the packaged models.yaml).
# models_path: models.yaml
# Optional: fetch Hugging Face tags/params for unknown model ids (cached).
huggingface_enrich: false
# On startup, score live inventory model ids into affinity (heuristics ± HF).
# Bypass with enrich_on_start: false, --no-enrich, or CHIMP_NO_ENRICH=1.
# Periodic poll_interval_seconds refresh still runs; boot enrich is a one-shot warm.
enrich_on_start: true
# Pin warm endpoint+model by prompt_cache_key / X-Chimp-Session / message prefix.
sticky: true
sticky_ttl_seconds: 1800
# Optional advisor for bare `auto` only (never overrides auto:coder etc.). Disabled by default.
# advisor:
#   enabled: true
#   base_url: http://127.0.0.1:1234
#   model: gemma-2-2b-it
#   api_key: ${ADVISOR_API_KEY:-}
#   timeout_seconds: 2

# Role / work-class names clients send in the "model" field.
# models: preference order. The router still prefers a free endpoint that
# already has one of these loaded over a higher preference that is cold.
# OpenBot auto:<class> aliases are also injected by default if omitted here.
aliases:
  # Any warm chat model (OpenBot default: chimpr/auto).
  auto:
    models: []
  # OpenBot desks — set each agent's model to one of these (or chimpr/auto:coder).
  auto:coder:
    models: []
  auto:ops:
    models: []
  auto:research:
    models: []
  auto:writer:
    models: []
  auto:design:
    models: []
  auto:qa:
    models: []
  auto:docs:
    models: []
  auto:skills:
    models: []
  auto:assistant:
    models: []
  auto:coord:
    models: []
  planner:
    models:
      - qwen3-32b
  executor:
    models:
      - qwen3-coder
      - qwen3-32b
  reviewer:
    models:
      - qwen3-32b
  triage:
    models:
      - qwen3-4b
      - qwen3-32b
endpoints:
  - name: laptop-unsloth
    kind: unsloth
    base_url: http://192.168.1.50:8888
    api_key: ${LAPTOP_UNSLOTH_API_KEY:-}
    max_concurrent: 1

  - name: desktop-lmstudio
    kind: lmstudio
    base_url: http://127.0.0.1:1234
    api_key: ${LMSTUDIO_API_KEY:-}
    max_concurrent: 1

  - name: remote-unsloth
    kind: unsloth
    base_url: https://your-tunnel.example
    api_key: ${REMOTE_UNSLOTH_API_KEY:-}
    max_concurrent: 1

  # Secondary cloud free tiers (from local-ai-planner providers allowlist).
  # Used only when no primary endpoint can take the request.
  - name: groq
    kind: openai
    tier: secondary
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY:-}
    max_concurrent: 2

  - name: mistral
    kind: openai
    tier: secondary
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY:-}
    max_concurrent: 2

  - name: llm7
    kind: openai
    tier: secondary
    base_url: https://api.llm7.io/v1
    api_key: ${LLM7_API_KEY:-}
    max_concurrent: 2

  # GitHub Models uses /chat/completions (no /v1); needs a path adapter before enabling.
  # - name: github-models
  #   kind: openai
  #   tier: secondary
  #   base_url: https://models.github.ai/inference
  #   api_key: ${GITHUB_TOKEN:-}

  # kind: llamaswap uses GET /v1/models and GET /running.
  # kind: openai uses GET /v1/models only, so loaded state stays unknown.
